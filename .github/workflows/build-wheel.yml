name: Test MSVC

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Show compiler
        shell: cmd
        run: |
          cl

      - name: Show CMake
        run: cmake --version

      - name: Show Ninja
        run: ninja --version

name: Build llama-cpp-python 0.3.25

on:
  workflow_dispatch:

permissions:
  contents: read

env:

  PYTHON_VERSION: "3.10"

  LLAMA_CPP_VERSION: "v0.3.25"

  WHEELHOUSE: wheelhouse

jobs:

##############################################################################
#
# BUILD CPU
#
##############################################################################

  cpu:

    name: CPU AVX2

    runs-on: windows-2022

    steps:

##############################################################################
# CHECKOUT
##############################################################################

      - name: Checkout
        uses: actions/checkout@v4

##############################################################################
# MSVC
##############################################################################

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

##############################################################################
# PYTHON
##############################################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

##############################################################################
# CREATE WHEELHOUSE
##############################################################################

      - name: Create wheelhouse
        shell: cmd
        run: |

          mkdir %WHEELHOUSE%

          mkdir %WHEELHOUSE%\common

          mkdir %WHEELHOUSE%\cpu

          mkdir %WHEELHOUSE%\cu118

##############################################################################
# CACHE PIP
##############################################################################

      - name: Cache pip
        uses: actions/cache@v4
        with:

          path: |
            ~\AppData\Local\pip\Cache

          key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}

          restore-keys: |
            ${{ runner.os }}-pip-

##############################################################################
# INSTALL BUILD TOOLS
##############################################################################

      - name: Install build tools
        shell: cmd
        run: |

          python -m pip install --upgrade pip

          pip install build

          pip install wheel

          pip install cmake

          pip install ninja

          pip install scikit-build-core

##############################################################################
# CLONE SOURCE
##############################################################################

      - name: Clone llama-cpp-python
        shell: cmd
        run: |

          git clone ^
            --recursive ^
            --branch %LLAMA_CPP_VERSION% ^
            https://github.com/abetlen/llama-cpp-python.git
##############################################################################
# BUILD CPU
##############################################################################

      - name: Build CPU Wheel
        shell: cmd
        working-directory: llama-cpp-python
        env:
          CMAKE_GENERATOR: Ninja
          FORCE_CMAKE: 1
          CMAKE_ARGS: >
            -DGGML_NATIVE=OFF
            -DGGML_AVX=ON
            -DGGML_AVX2=ON
            -DGGML_F16C=ON
            -DGGML_FMA=ON
            -DGGML_AVX512=OFF
        run: |

          python -m build --wheel

##############################################################################
# VERIFY CPU WHEEL
##############################################################################

      - name: Verify CPU Wheel
        shell: cmd
        working-directory: llama-cpp-python
        run: |

          if not exist dist (
              echo Dist folder not found.
              exit /b 1
          )

          dir dist

##############################################################################
# COPY CPU WHEEL
##############################################################################

      - name: Copy CPU Wheel
        shell: powershell
        run: |

          $wheel = Get-ChildItem `
              llama-cpp-python/dist/*.whl |
              Select-Object -First 1

          if ($null -eq $wheel)
          {
              throw "CPU wheel not found."
          }

          Copy-Item `
              $wheel.FullName `
              "${{ env.WHEELHOUSE }}/cpu/"

##############################################################################
# SHOW CPU WHEELHOUSE
##############################################################################

      - name: Show CPU Wheelhouse
        shell: cmd
        run: |

          dir %WHEELHOUSE%\cpu

##############################################################################
# UPLOAD CPU ARTIFACT
##############################################################################

      - name: Upload CPU Wheel
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-python-cpu
          path: wheelhouse/cpu/*.whl
##############################################################################
#
# BUILD CUDA 11.8
#
##############################################################################

  cuda:

    name: CUDA 11.8

    runs-on: windows-2022

    needs: cpu

    steps:

##############################################################################
# CHECKOUT
##############################################################################

      - name: Checkout
        uses: actions/checkout@v4

##############################################################################
# MSVC
##############################################################################

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

##############################################################################
# PYTHON
##############################################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

##############################################################################
# CACHE PIP
##############################################################################

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pip\Cache
          key: windows-cuda-pip-${{ env.PYTHON_VERSION }}
          restore-keys: |
            windows-cuda-pip-

##############################################################################
# INSTALL BUILD TOOLS
##############################################################################

      - name: Install build tools
        shell: cmd
        run: |

          python -m pip install --upgrade pip

          pip install build wheel

          pip install cmake ninja

          pip install scikit-build-core

##############################################################################
# INSTALL CUDA 11.8
##############################################################################

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: "11.8.0"

##############################################################################
# CLONE
##############################################################################

      - name: Clone llama-cpp-python
        shell: cmd
        run: |

          git clone ^
            --recursive ^
            --branch %LLAMA_CPP_VERSION% ^
            https://github.com/abetlen/llama-cpp-python.git

##############################################################################
# BUILD CUDA
##############################################################################

      - name: Build CUDA Wheel
        shell: cmd
        working-directory: llama-cpp-python
        env:
          CMAKE_GENERATOR: Ninja
          FORCE_CMAKE: 1
          CMAKE_ARGS: -DGGML_CUDA=ON
        run: |

          python -m build --wheel

##############################################################################
# VERIFY
##############################################################################

      - name: Verify CUDA Wheel
        shell: cmd
        working-directory: llama-cpp-python
        run: |

          dir dist

##############################################################################
# COPY
##############################################################################

      - name: Copy CUDA Wheel
        shell: powershell
        run: |

          $wheel = Get-ChildItem `
            llama-cpp-python/dist/*.whl |
            Select-Object -First 1

          if ($null -eq $wheel)
          {
              throw "CUDA wheel not found."
          }

          mkdir wheelhouse\cu118 -Force

          Copy-Item `
            $wheel.FullName `
            wheelhouse\cu118\

##############################################################################
# UPLOAD
##############################################################################

      - name: Upload CUDA Wheel
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-python-cu118
          path: wheelhouse/cu118/*.whl

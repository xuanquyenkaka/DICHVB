name: Test GitHub Actions

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Python
        shell: cmd
        run: |
          python --version

      - name: Show CMake
        shell: cmd
        run: |
          cmake --version

      - name: Show MSVC
        shell: cmd
        run: |
          cl

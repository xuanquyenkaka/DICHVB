name: Build llama-cpp-python CUDA 11.8

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.10"
  LLAMA_CPP_VERSION: "v0.3.25"

jobs:

  cuda:

    name: CUDA 11.8

    runs-on: windows-2022

    steps:

      ########################################################################
      # Checkout
      ########################################################################

      - name: Checkout
        uses: actions/checkout@v4

      ########################################################################
      # Setup MSVC
      ########################################################################

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      ########################################################################
      # Setup Python
      ########################################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      ########################################################################
      # Cache pip
      ########################################################################

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pip\Cache
          key: windows-cu118-${{ env.PYTHON_VERSION }}
          restore-keys: |
            windows-cu118-

      ########################################################################
      # Install build tools
      ########################################################################

      - name: Install build tools
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install build wheel cmake ninja scikit-build-core

      ########################################################################
      # Install CUDA Toolkit 11.8
      ########################################################################

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: "11.8.0"

      ########################################################################
      # Verify CUDA
      ########################################################################

      - name: Verify CUDA
        shell: cmd
        run: |
          where nvcc
          nvcc --version
          cl

      ########################################################################
      # Clone llama-cpp-python
      ########################################################################

      - name: Clone llama-cpp-python
        shell: cmd
        run: |
          git clone ^
            --recursive ^
            --branch %LLAMA_CPP_VERSION% ^
            https://github.com/abetlen/llama-cpp-python.git

      ########################################################################
      # Build CUDA Wheel
      ########################################################################

      - name: Build CUDA Wheel
        shell: cmd
        working-directory: llama-cpp-python
        env:
          CMAKE_GENERATOR: Ninja
          FORCE_CMAKE: "1"
          CUDAFLAGS: -allow-unsupported-compiler
          CMAKE_ARGS: >
            -DGGML_CUDA=ON
            -DGGML_NATIVE=OFF
            -DGGML_CUDA_ARCHITECTURES=50
            -DCMAKE_CUDA_FLAGS=-allow-unsupported-compiler
        run: |
          python -m build --wheel

      ########################################################################
      # Verify Wheel
      ########################################################################

      - name: Verify Wheel
        shell: cmd
        working-directory: llama-cpp-python
        run: |
          if not exist dist (
              echo Wheel build failed.
              exit /b 1
          )
          dir dist

      ########################################################################
      # Upload Artifact
      ########################################################################

      - name: Upload CUDA Wheel
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-python-cu118
          path: llama-cpp-python/dist/*.whl
